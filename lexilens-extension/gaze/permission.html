<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Enable camera for reading assist</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 520px; margin: 12vh auto; padding: 0 24px; color: #222; }
  button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 0; background: #2d6cdf; color: #fff; cursor: pointer; }
  #msg { margin-top: 18px; }
  .ok { color: #1e8e3e; } .bad { color: #c5221f; }
</style>
</head>
<body>
  <h2>Turn on eye tracking</h2>
  <p>The extension uses your webcam to notice when a line of text is hard to read. Video is processed on this computer and is never uploaded or saved.</p>
  <button id="go">Allow camera</button>
  <div id="msg"></div>
  <script src="permission.js"></script>
</body>
</html>
