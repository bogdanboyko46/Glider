<!doctype html><html><body style="margin:0;background:#222;color:#fff">fake camera
<script>
let port; const nonce = location.hash.slice(1);
window.trueGaze = { x: 400, y: 300, W: 1280, H: 720 };
let seed = 11; const rnd = () => ((seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648);
const g = () => Math.sqrt(-2 * Math.log(rnd() + 1e-12)) * Math.cos(2 * Math.PI * rnd());
const t0 = performance.now();
// Per-frame noise tuned to ~60px; slow vertical bias drift (~±25px) after calibration mimics head settling.
function sim(x, y) {
  const { W, H } = window.trueGaze;
  const drift = window.driftOn ? 25 * Math.sin((performance.now() - t0) / 20000) : 0;
  y += drift;
  const U = 0.12 * (x / W - 0.5), V = 0.05 * (y / H - 0.5);
  const su = 60 / W * 0.12, sv = 60 / H * 0.05;
  const uA = U + su * g(), uB = U + su * g(), vA = V + sv * g(), vB = V + sv * g();
  const vlA = V * 0.9 + sv * g(), vlB = V * 0.9 + sv * g();
  const oA = 0.3 + V * 0.8 + sv * g(), oB = 0.3 + V * 0.8 + sv * g();
  const um = (uA + uB) / 2, vm = (vA + vB) / 2, vlm = (vlA + vlB) / 2, om = (oA + oB) / 2;
  const f = [uA, vA, vlA, oA, uB, vB, vlB, oB, um, vm, vlm, om, um * um, vm * vm, um * vm, vlm * vlm, um * vlm];
  for (let k = 0; k < 8; k++) f.push(Math.max(0, (k < 4 ? (k % 2 ? V : -V) * 4 : U * 3) + 0.03 * g()));
  for (let k = 0; k < 16; k++) f.push(k === 15 ? 1 : 0.01 * g());
  f.push(0.5, 0.5, 0.1);
  return f;
}
addEventListener('message', (e) => {
  if (port || !e.data || e.data.type !== 'gr-init' || e.data.nonce !== nonce) return;
  port = e.ports[0];
  // window.__fakeFrameMode on the page that embeds this frame makes the start end badly, the way frame.js reports it:
  // 'silent' (the frame never answers), 'denied', 'blocked', 'in-use', 'no-camera', 'model' (the face model does not load).
  let mode = ''; try { mode = String(parent.__fakeFrameMode || ''); } catch (_) { /* cross-origin parent */ }
  const bad = { denied: ['needs-permission', 'camera permission needed', 'camera-permission'], blocked: ['needs-permission', 'camera blocked', 'camera-blocked'], 'in-use': ['error', 'camera in use by another app', 'camera-in-use'], 'no-camera': ['error', 'no camera found', 'no-camera'], model: ['error', 'the wasm file is missing', 'model-load'] }[mode];
  if (mode === 'silent') return;
  if (bad) { port.postMessage({ type: 'status', state: 'loading', detail: 'opening camera…' }); port.postMessage({ type: 'status', state: bad[0], detail: bad[1], code: bad[2] }); return; }
  port.postMessage({ type: 'camera', settings: { width: 1280, height: 720, frameRate: 30, deviceLabel: 'fake camera', videoWidth: 1280, videoHeight: 720 } });
  port.postMessage({ type: 'status', state: 'ready', detail: 'tracking' });
  // window.frameAge (ms) makes the frames carry a capture time that far in the past, on this frame's own clock, as frame.js does.
  const stamp = () => (window.frameAge ? { tc: performance.now() - window.frameAge, ts: performance.now(), tsrc: 'capture', delegate: 'CPU' } : {});
  // window.__fakeHeadDx on the page that embeds this frame moves the head sideways in the picture (a share of its width),
  // from the very first frame: for the head gate and the check before a saved calibration is reused.
  const headDx = () => { try { return Number(parent.__fakeHeadDx) || 0; } catch (_) { return 0; } };
  setInterval(() => { const t = window.trueGaze; port.postMessage({ type: 'f', face: true, f: sim(t.x, t.y), head: { cx: 0.5 + headDx(), cy: 0.5, s: 0.1 }, blink: false, fps: 30, ...stamp() }); }, 33);
});
</script></body></html>
