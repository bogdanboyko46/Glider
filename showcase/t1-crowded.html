<!doctype html>
<html lang="en" data-duration="6000">
<head>
<meta charset="utf-8">
<title>Glider title: crowded to clear</title>
<link rel="stylesheet" href="base.css">
<style>
/* Title variation 1. A page of crowded lines fills the screen and tightens; then the crowd clears,
   five of the lines glide to the right edge and become the logo, and the name lands.
   Timeline (ms): 0 crowded page · 300-1500 it tightens · 1600 the crowd fades, five lines travel · 2600 middle stroke turns green
   · 2500 "Glider" · 3300 line · 6000 end */
body { margin: 0; width: 1280px; height: 720px; overflow: hidden; position: relative; background: var(--bg); color: var(--ink); }
.ln { position: absolute; left: 190px; height: 13px; border-radius: 7px; background: #7d8c81; animation: squeeze 1.2s cubic-bezier(.5, 0, .5, 1) .3s both, clear .5s ease 1.6s forwards; }
@keyframes squeeze { to { transform: translateY(var(--sq)) scaleX(1.04); background: #55655a; } }
@keyframes clear { to { opacity: 0; } }
.ln.k { animation: squeeze 1.2s cubic-bezier(.5, 0, .5, 1) .3s both, travel 1s cubic-bezier(.2, 0, 0, 1) 1.6s forwards; }
@keyframes travel { to { transform: none; left: var(--tx); top: var(--ty); width: var(--tw); height: 44px; border-radius: 22px; background: var(--ink); } }
.ln.k.mid { animation: squeeze 1.2s cubic-bezier(.5, 0, .5, 1) .3s both, travel 1s cubic-bezier(.2, 0, 0, 1) 1.6s forwards, green .35s ease 2.6s forwards; }
@keyframes green { to { background: var(--accent); } }
h1 { position: absolute; left: 110px; top: 200px; margin: 0; font: 700 200px/1 "Lexend", sans-serif; letter-spacing: -.035em; animation: rise .7s cubic-bezier(.2, 0, 0, 1) 2.5s both; }
p { position: absolute; left: 118px; top: 440px; margin: 0; font: 400 44px/1.25 "Atkinson", sans-serif; color: var(--muted); letter-spacing: .01em; animation: rise .6s cubic-bezier(.2, 0, 0, 1) 3.3s both; }
p b { color: var(--ink); }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } }
</style>
</head>
<body>
<h1>Glider</h1>
<p>A reading lens for <b>dyslexia</b>.</p>
<script>
// Static set-up only: 26 crowded lines; five of them are marked to become the logo strokes.
const widths = [860, 900, 840, 880, 610, 900, 870, 850, 890, 700, 900, 860, 880, 540, 900, 870, 840, 890, 760, 900, 850, 880, 620, 900, 860, 480];
const logo = { 4: [10, 0], 9: [18, 1], 13: [28, 2], 18: [18, 3], 22: [10, 4] };   // line index -> [stroke length, stroke row]
widths.forEach((w, i) => {
  const d = document.createElement('div');
  const top = 96 + i * 20.5;
  d.className = 'ln' + (logo[i] ? ' k' + (logo[i][1] === 2 ? ' mid' : '') : '');
  d.style.cssText = `top:${top}px;width:${w}px;--sq:${(360 - top) * 0.16}px;`;
  if (logo[i]) { const len = logo[i][0] * 13; d.style.cssText += `--tw:${len}px;--tx:${1280 - len}px;--ty:${178 + logo[i][1] * 80}px;`; }
  document.body.appendChild(d);
});
</script>
</body>
</html>
