<!doctype html>
<html lang="en" data-duration="5000">
<head>
<meta charset="utf-8">
<title>Glider title: the glide</title>
<link rel="stylesheet" href="base.css">
<style>
/* Title variation 6. Logo first, nothing else: five strokes glide across the whole screen from left to right and come to rest
   on the right edge; the name follows in their wake. The calmest of the set, and the most about the name.
   Timeline (ms): 200-1700 strokes glide across, staggered · 1500 middle turns green · 1500 "Glider" wipes in behind them
   · 2500 line · 5000 end */
body { margin: 0; width: 1280px; height: 720px; overflow: hidden; position: relative; background: var(--bg); color: var(--ink); }
.mark { position: absolute; right: 0; top: 178px; display: grid; gap: 36px; justify-items: end; }
.mark i { display: block; height: 44px; border-radius: 22px; background: var(--ink); animation: glide 1.4s cubic-bezier(.3, 0, .1, 1) both; }
.mark i:nth-child(1) { width: 130px; animation-delay: .5s; } .mark i:nth-child(2) { width: 234px; animation-delay: .35s; }
.mark i:nth-child(3) { width: 364px; animation: glide 1.4s cubic-bezier(.3, 0, .1, 1) .2s both, green .4s ease 1.5s forwards; }
.mark i:nth-child(4) { width: 234px; animation-delay: .35s; } .mark i:nth-child(5) { width: 130px; animation-delay: .5s; }
@keyframes glide { from { transform: translateX(-1500px); } }
@keyframes green { to { background: var(--accent); } }
h1 { position: absolute; left: 110px; top: 190px; margin: 0; font: 700 200px/1 "Lexend", sans-serif; letter-spacing: -.035em; animation: wipe .9s cubic-bezier(.3, 0, .1, 1) 1.1s both; }
@keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 -5% 0 0); } }
p { position: absolute; left: 118px; top: 430px; margin: 0; font: 400 44px/1.25 "Atkinson", sans-serif; color: var(--muted); animation: rise .6s cubic-bezier(.2, 0, 0, 1) 2.5s both; }
p b { color: var(--ink); }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } }
</style>
</head>
<body>
<div class="mark"><i></i><i></i><i></i><i></i><i></i></div>
<h1>Glider</h1>
<p>Reading, at <b>your</b> pace. Built for dyslexia.</p>
</body>
</html>
