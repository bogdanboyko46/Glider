<!doctype html>
<html lang="en" data-duration="4000">
<head>
<meta charset="utf-8">
<title>Glider · s0 title</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Opening sting. All motion is CSS keyframes with delays and fill-mode both (no JS), so it can be recorded frame by frame.
     Timeline (ms): 150-1150 five strokes reach out from the right edge · 1150 middle stroke turns green ·
     1450 "Glider" · 2050 tagline · 2950 the green stroke reaches once more · hold to 4000. */
  @font-face { font-family: "Atkinson"; src: url("../glider-extension/fonts/AtkinsonHyperlegible-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Atkinson"; src: url("../glider-extension/fonts/AtkinsonHyperlegible-Bold.woff2") format("woff2"); font-weight: 700; }
  html, body { margin: 0; }
  body {
    width: 1280px; height: 720px; overflow: hidden; position: relative;
    background: #eef2ea; color: #20352a;
    font-family: "Atkinson", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }

  /* soft light that drifts in behind the wordmark */
  .glow {
    position: absolute; left: -180px; top: 60px; width: 900px; height: 600px; border-radius: 50%;
    background: radial-gradient(closest-side, #ffffff 0%, rgba(255, 255, 255, 0) 100%);
    animation: glow 1500ms 1100ms ease-out both;
  }
  @keyframes glow { from { opacity: 0; transform: scale(.8); } to { opacity: .9; transform: none; } }

  /* The logo "Reach": five right-anchored rounded strokes, lengths 10 18 28 18 10 on a 40-unit grid, 4 units thick. 1 unit = 11px. */
  .reach { position: absolute; right: 0; top: 162px; width: 330px; height: 396px; }
  .slot { position: absolute; right: -22px; height: 44px; transform-origin: right center; }
  .slot:nth-child(1) { top: 0;     width: 132px; }   /* 10 units + 22px tucked past the edge */
  .slot:nth-child(2) { top: 88px;  width: 220px; }   /* 18 */
  .slot:nth-child(3) { top: 176px; width: 330px; }   /* 28 */
  .slot:nth-child(4) { top: 264px; width: 220px; }   /* 18 */
  .slot:nth-child(5) { top: 352px; width: 132px; }   /* 10 */
  .stroke {
    width: 100%; height: 100%; border-radius: 22px; background: #20352a; transform-origin: right center;
    animation: reach 520ms cubic-bezier(.2, .9, .25, 1.12) both;
  }
  .slot:nth-child(1) .stroke { animation-delay: 150ms; }
  .slot:nth-child(2) .stroke { animation-delay: 270ms; }
  .slot:nth-child(3) .stroke { animation: reach 520ms 390ms cubic-bezier(.2, .9, .25, 1.12) both, green 400ms 1150ms ease-out both; }
  .slot:nth-child(4) .stroke { animation-delay: 510ms; }
  .slot:nth-child(5) .stroke { animation-delay: 630ms; }
  @keyframes reach { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes green { from { background: #20352a; } to { background: #2f6b4a; } }
  /* the green stroke reaches out once more, toward the word */
  .slot:nth-child(3) { animation: again 900ms 2950ms cubic-bezier(.4, 0, .2, 1) both; }
  @keyframes again { 0%, 100% { transform: scaleX(1); } 45% { transform: scaleX(1.16); } }

  .word {
    position: absolute; left: 120px; top: 214px; margin: 0;
    font-size: 176px; font-weight: 700; line-height: 1; letter-spacing: -3px;
    animation: rise 650ms 1450ms cubic-bezier(.2, .8, .2, 1) both;
  }
  .rule {
    position: absolute; left: 126px; top: 412px; width: 132px; height: 8px; border-radius: 4px; background: #2f6b4a;
    transform-origin: left center; animation: draw 450ms 1800ms cubic-bezier(.2, .8, .2, 1) both;
  }
  .tag {
    position: absolute; left: 126px; top: 448px; margin: 0;
    font-size: 40px; font-weight: 400; line-height: 1.25; color: #566b5c;
    animation: rise 650ms 2050ms cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="reach" aria-hidden="true">
    <div class="slot"><div class="stroke"></div></div>
    <div class="slot"><div class="stroke"></div></div>
    <div class="slot"><div class="stroke"></div></div>
    <div class="slot"><div class="stroke"></div></div>
    <div class="slot"><div class="stroke"></div></div>
  </div>
  <h1 class="word">Glider</h1>
  <div class="rule"></div>
  <p class="tag">It notices when reading gets hard.</p>
</body>
</html>
