<!doctype html>
<html lang="en" data-duration="6000">
<head>
<meta charset="utf-8">
<title>Glider title: the word in chunks</title>
<link rel="stylesheet" href="base.css">
<style>
/* Title variation 5. The product's own trick, done on the word itself: "dyslexia" split into chunks with the sound of each,
   then sounded out one chunk at a time. Then the name.
   Timeline (ms): 200 the word, whole · 1000 it splits into three chips · 1500 sounds appear · 2100, 2600, 3100 each chip sounded
   · 3700 chips settle small at the top · 3900 "Glider" · 4600 line · 6000 end */
body { margin: 0; width: 1280px; height: 720px; overflow: hidden; position: relative; background: var(--bg); color: var(--ink); }
.word { position: absolute; left: 0; right: 0; top: 208px; display: flex; justify-content: center; gap: 0; animation: gap .5s cubic-bezier(.2, 0, 0, 1) 1s forwards, away .6s cubic-bezier(.2, 0, 0, 1) 3.7s forwards; transform-origin: 118px 0; }
@keyframes gap { to { gap: 18px; } }
@keyframes away { to { transform: translate(-246px, -150px) scale(.3); opacity: .0; } }
.chip { display: grid; justify-items: center; gap: 6px; padding: 26px 8px 22px; border-radius: 999px; background: transparent; animation: chip .5s cubic-bezier(.2, 0, 0, 1) 1s forwards; }
@keyframes chip { to { padding: 26px 44px 22px; background: var(--chip-a); } }
.chip:nth-child(2) { animation-name: chipb; }
@keyframes chipb { to { padding: 26px 44px 22px; background: var(--chip-b); } }
.chip b { font: 700 150px/1 "Atkinson", sans-serif; letter-spacing: .01em; }
.chip span { font: 400 46px/1 "Atkinson", sans-serif; color: var(--muted); opacity: 0; animation: show .4s ease 1.5s forwards; }
@keyframes show { to { opacity: 1; } }
.chip.s1 { animation: chip .5s cubic-bezier(.2, 0, 0, 1) 1s forwards, say .45s ease 2.1s; }
.chip.s2 { animation: chipb .5s cubic-bezier(.2, 0, 0, 1) 1s forwards, say .45s ease 2.6s; }
.chip.s3 { animation: chip .5s cubic-bezier(.2, 0, 0, 1) 1s forwards, say .45s ease 3.1s; }
@keyframes say { 50% { transform: translateY(-16px) scale(1.06); box-shadow: 0 0 0 6px var(--ink); } }
h1 { position: absolute; left: 110px; top: 190px; margin: 0; font: 700 200px/1 "Lexend", sans-serif; letter-spacing: -.035em; animation: rise .7s cubic-bezier(.2, 0, 0, 1) 3.9s both; }
p.t { position: absolute; left: 118px; top: 430px; margin: 0; font: 400 44px/1.25 "Atkinson", sans-serif; color: var(--muted); animation: rise .6s cubic-bezier(.2, 0, 0, 1) 4.6s both; }
p.t b { color: var(--ink); }
.mark { position: absolute; right: 0; top: 178px; display: grid; gap: 36px; justify-items: end; }
.mark i { display: block; height: 44px; border-radius: 22px; background: var(--ink); transform-origin: right center; animation: reach .6s cubic-bezier(.2, 0, 0, 1) both; }
.mark i:nth-child(1) { width: 130px; animation-delay: 4s; } .mark i:nth-child(2) { width: 234px; animation-delay: 4.08s; }
.mark i:nth-child(3) { width: 364px; background: var(--accent); animation-delay: 4.16s; }
.mark i:nth-child(4) { width: 234px; animation-delay: 4.24s; } .mark i:nth-child(5) { width: 130px; animation-delay: 4.32s; }
@keyframes reach { from { transform: scaleX(0); } }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } }
</style>
</head>
<body>
<div class="word">
  <div class="chip s1"><b>dys</b><span>dihs</span></div>
  <div class="chip s2"><b>lex</b><span>LEHK</span></div>
  <div class="chip s3"><b>ia</b><span>see-uh</span></div>
</div>
<h1>Glider</h1>
<p class="t">Hard words, <b>one chunk at a time</b>.</p>
<div class="mark"><i></i><i></i><i></i><i></i><i></i></div>
</body>
</html>
